<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Case Diary</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="appbar">
  <h1 id="title">কেস ডায়েরি</h1>
  <div id="barActions"></div>
</header>

<main id="view" aria-live="polite"></main>
<footer class="credit">App built by <b>Adv Abu Fahad Taukir</b></footer>

<button id="fab" class="fab" hidden aria-label="নতুন">＋</button>

<nav class="tabs" id="tabs" aria-label="প্রধান মেনু">
  <a href="#/today" data-tab="today">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>আজ</span>
  </a>
  <a href="#/cases" data-tab="cases">
    <svg viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3 13h18"/></svg>
    <span>মামলা</span>
  </a>
  <a href="#/clients" data-tab="clients">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.5-3.6 3.2-5.5 6.5-5.5s6 1.9 6.5 5.5M16 5.2a3.5 3.5 0 0 1 0 6.6M18.5 14.8c1.7.7 2.7 2.3 3 5.2"/></svg>
    <span>মক্কেল</span>
  </a>
  <a href="#/fees" data-tab="fees">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M15.5 15h2"/></svg>
    <span>হিসাব</span>
  </a>
  <a href="#/more" data-tab="more">
    <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg>
    <span>আরও</span>
  </a>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="gate" class="gate" hidden></div>
<div id="dialog" class="dialog" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script src="firebase-config.js"></script>
<script src="cloud.js"></script>
<script src="courts-default.js"></script>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
