name: APK তৈরি করুন

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: দরকারি ফাইল আছে কিনা যাচাই
        run: |
          missing=0
          for f in package.json capacitor.config.json www/index.html www/app.js www/app.css scripts/patch-android.js assets/icon-only.png assets/icon-foreground.png assets/icon-background.png; do
            if [ ! -f "$f" ]; then echo "::error::ফাইল পাওয়া যায়নি: $f"; missing=1; fi
          done
          echo "রিপোজিটরির ফাইল:"; ls -A
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: প্যাকেজ ইনস্টল
        run: npm install --no-audit --no-fund

      - name: অ্যান্ড্রয়েড প্রজেক্ট তৈরি
        run: npx cap add android

      - name: নোটিফিকেশনের অনুমতি যোগ
        run: node scripts/patch-android.js

      - name: অ্যাপের আইকন তৈরি
        run: npx capacitor-assets generate --android

      - name: ওয়েব ফাইল অ্যান্ড্রয়েড প্রজেক্টে কপি
        run: npx cap sync android

      - name: APK বিল্ড
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK ফাইল সংরক্ষণ
        uses: actions/upload-artifact@v4
        with:
          name: case-diary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
